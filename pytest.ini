[pytest]
# Declare custom markers so pytest doesn't emit PytestUnknownMarkWarning.
markers =
    live: Tests that call real external APIs (Hindsight, Groq, NLI model).
          Require HINDSIGHT_API_KEY env var. Run with: python -m pytest -v -m live

# By default exclude @pytest.mark.live so the offline suite runs without
# any network access. CI should always run: python -m pytest -v -m "not live"
addopts = -m "not live"

testpaths = tests
pythonpath = .

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
